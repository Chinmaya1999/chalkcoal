name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: awsmallick1999/chalkcoal

jobs:
  # ---------- 1. secrets scan + dependency audit ----------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Audit production dependencies (fail on high/critical)
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix client

  # ---------- 2. build the storefront + run the API tests against a real MongoDB ----------
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/chalkcoal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Build storefront
        run: npm run build --prefix client
      - name: Syntax check server
        run: find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: API tests
        run: npm test --prefix server

  # ---------- 3. build image, scan it, push to Docker Hub ----------
  image:
    needs: [security, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fail on fixable critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  # ---------- 4. deploy to the server over SSH (auto-rollback on failed health check) ----------
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chalkcoal.com
    concurrency: { group: production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519 "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Ship deploy files
        run: |
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/chalkcoal/"
      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin >/dev/null && bash /opt/chalkcoal/deploy.sh ${{ needs.image.outputs.tag }}"
      - name: Post-deploy smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://api.chalkcoal.com/api/health
          curl -fsS --retry 3 -o /dev/null https://chalkcoal.com/
          curl -fsS -o /dev/null https://chalkcoal.com/sitemap.xml
